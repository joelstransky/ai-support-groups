<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Support Groups - Discord Invite</title>
    <meta
      name="description"
      content="Join the AI Support Groups Discord community"
    />

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="AI Support Groups" />
    <meta
      property="og:description"
      content="Join our Discord community for AI support and discussion"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="ai-support-groups.png" />

    <style>
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }

      body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
          background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #ffffff;
          opacity: 1;
          transition: opacity 0.4s ease;
      }

      body.fade-out {
          opacity: 0;
      }

      .container {
          text-align: center;
          padding: 2rem;
          max-width: 500px;
      }

      .logo {
          width: 150px;
          height: auto;
          margin: 0 auto 2rem;
      }

      .logo img {
          width: 100%;
          height: auto;
          filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.4));
      }

      h1 {
          font-size: 2.5rem;
          margin-bottom: 0.5rem;
          font-weight: 700;
      }

      .subtitle {
          font-size: 1.1rem;
          color: #a0a0a0;
          margin-bottom: 2rem;
      }

      .join-btn {
          display: inline-block;
          background: #5865F2;
          color: white;
          text-decoration: none;
          padding: 1rem 2.5rem;
          border-radius: 8px;
          font-size: 1.1rem;
          font-weight: 600;
          transition: all 0.3s ease;
          box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
      }

      .join-btn:hover {
          background: #4752c4;
          transform: translateY(-2px);
          box-shadow: 0 6px 20px rgba(88, 101, 242, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <img src="ai-support-groups.png" alt="AI Support Groups Logo">
      </div>

      <h1>AI Support Groups</h1>
      <p class="subtitle">A Discord Community</p>

      <a href="https://discord.gg/TNDp5EE4vv" class="join-btn"
        >Join AI Support Groups</a
      >
    </div>

    <script>
      document
        .querySelector(".join-btn")
        .addEventListener("click", function (e) {
          e.preventDefault();
          const href = this.href;
          document.body.classList.add("fade-out");
          setTimeout(() => {
            window.location.href = href;
          }, 400);
        });
    </script>
  </body>
</html>
